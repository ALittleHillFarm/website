name = "alhf-store"
main = "worker.js"
compatibility_date = "2026-09-20"
# Lets the site checks (Alerts in worker.js) fetch our own public addresses
# the way a visitor would, instead of being refused as a worker calling a
# worker on the same account.
compatibility_flags = ["global_fetch_strictly_public"]

# Deploys to <your-subdomain>.workers.dev until DNS is live on Cloudflare.
# Set to false once the custom domain below is active.
workers_dev = true

# Alerts: site checks every 30 minutes, and the morning digest at 14:00 UTC
# (7am Pacific daylight time, 6am standard). See the Alerts section of worker.js.
[triggers]
crons = ["*/30 * * * *", "0 14 * * *"]

# The storefront. Anything the worker does not route is served from here.
[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves a matching asset BEFORE the Worker runs, so
# /admin would be returned straight from the edge cache and never hit the auth
# check. Force the Worker to run first for anything admin-related.
# /product, /sitemap.xml and /robots.txt run first too: the worker stamps each
# product's own details into its page for link previews and search engines.
run_worker_first = ["/admin", "/admin/*", "/api/*", "/product", "/sitemap.xml", "/robots.txt"]

# Uploaded photos (products now, goats later). Served through /media/* by the
# worker rather than made public, so we control content-type and caching.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "alhf-media"

[[d1_databases]]
binding = "DB"
database_name = "alhf-store"
database_id = "cbc7ed1f-6dfd-43f2-968c-5348a79dbdf9"

# The real address. workers_dev stays on as well, because the Stripe sandbox
# webhook is registered against the workers.dev URL - switch it to
# https://store.alittlehillfarm.com/api/webhook when you create the live one.
[[routes]]
pattern = "store.alittlehillfarm.com"
custom_domain = true

# Secrets are NOT set here. Put them in .env (gitignored) and run:
#   npx wrangler secret bulk .env
