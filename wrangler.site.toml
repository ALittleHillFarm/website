# The farm site — herd, goat pages, guide, about.
# Static pages from dist-site/, plus site-worker.js, which adds the shared
# header/footer and renders the goats from the store's database. The store is
# a separate Worker (store/wrangler.toml) that shares that database and the
# photo bucket; the admin screen that edits the goats lives there.
#
# Rebuild + deploy:
#   bash build-site.sh && npx wrangler deploy -c wrangler.site.toml

name = "alhf-site"
compatibility_date = "2026-09-21"
main = "site-worker.js"
# Keep the old workers.dev address answering too, so links shared before the
# move (and bookmarks) still work. Canonical tags point search at the real domain.
workers_dev = true

[assets]
directory = "./dist-site"
binding = "ASSETS"
# Serve 404.html for unknown paths. html_handling = none keeps the hand-written
# links working exactly as authored (does.html stays does.html) instead of
# 307-redirecting every internal link to an extensionless form.
not_found_handling = "404-page"
html_handling = "none"
# The worker MUST run first. Without this, Cloudflare answers a browser
# page-load of "/" straight from the asset layer - no file matches "/", so it
# serves 404.html and the worker that maps "/" to index.html never runs. Plain
# curl is not a page-load and took the worker path, so every command-line check
# passed while every real visitor to the home page saw "That page wandered off".
run_worker_first = true

# The herd (goats table). Same database the store and its admin screen use.
[[d1_databases]]
binding = "DB"
database_name = "alhf-store"
database_id = "cbc7ed1f-6dfd-43f2-968c-5348a79dbdf9"

# Goat photos uploaded from the admin screen, served at /media/<file>.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "alhf-media"

# The real address (moved off Shopify 2026-09-28). www redirects to the apex
# in site-worker.js.
[[routes]]
pattern = "alittlehillfarm.com"
custom_domain = true

[[routes]]
pattern = "www.alittlehillfarm.com"
custom_domain = true
